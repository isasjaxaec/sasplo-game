<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>サスプロ Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#07090d; --board:#0e1117; --panel:#161b24; --line:#2a3240; --ink:#e9edf3; --mute:#8b96a8;
  --gold:#e8b923; --gold-d:#8a6a0e; --eng:#e3892f; --sci:#4b8ff0; --stf:#3bb872; --craft:#9aa7ff;
  --glitter:#0c4a33; --danger:#ff6b6b;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:12px 40px;
  background-image:radial-gradient(1px 1px at 20% 30%,#ffffff22 50%,transparent 51%),radial-gradient(1px 1px at 70% 80%,#ffffff1a 50%,transparent 51%),radial-gradient(1.5px 1.5px at 45% 60%,#ffffff14 50%,transparent 51%);
  background-size:180px 180px,240px 240px,310px 310px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{font-family:var(--f-num);letter-spacing:.2em;color:var(--gold);font-size:11px}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.btn.primary:disabled,.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent}
.stats{display:flex;gap:16px;font-family:var(--f-num);color:var(--mute);font-size:13px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:16px}

/* setup */
.setup{background:var(--board);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:18px}
.setup h2{font-family:var(--f-disp);font-weight:400;margin:0;font-size:20px}
.setup .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.setup label{color:var(--mute);font-size:13px}
.setup select,.setup input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
.pl-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;max-width:420px}
.lede{color:var(--mute);max-width:62ch;margin:0}

/* game layout */
.game{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--board);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:var(--mute);font-family:var(--f-num);font-weight:700;text-transform:uppercase}
.phasebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,#1c1606,#0e1117);border:1px solid var(--gold-d);border-radius:10px;padding:10px 14px}
.phasebar .who{font-family:var(--f-disp);font-size:18px}
.phasebar .hint{color:var(--mute);font-size:13px}
.steps{display:flex;gap:6px;font-family:var(--f-num);font-size:12px}
.steps span{padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.steps span.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}

/* pool */
.pool{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

/* play sheet */
.sheet{background:#000;border-radius:10px;padding:12px;border:1px solid #222;display:grid;gap:12px}
.sheet .lbl{background:#d9d9d9;color:#111;font-weight:700;font-size:12px;padding:1px 10px;justify-self:center;border-radius:2px}
.slots,.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{border:1px solid #333;border-radius:6px;min-height:150px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:4px;background:#0b0b0b}
.slot.ok{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.slot.pick{cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--gold) inset}}
@media (prefers-reduced-motion:reduce){.slot.pick{animation:none}}
.pts{position:absolute;top:4px;left:4px;background:#e8e8e8;color:#000;font-family:var(--f-num);font-weight:700;font-size:12px;width:20px;height:20px;display:grid;place-items:center;border-radius:2px;z-index:2}
.cond{display:flex;gap:6px;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:12px;flex-wrap:wrap}
.cond span{display:inline-flex;align-items:center;gap:2px}
.cond .met{opacity:1}.cond .unmet{opacity:.45}
.i-e{color:var(--eng)}.i-s{color:var(--sci)}.i-t{color:var(--stf)}
.col{border:1px solid #333;border-radius:6px;min-height:170px;background:#0b0b0b;padding:4px;position:relative;display:flex;flex-direction:column}
.col .head{text-align:center;font-size:11px;color:#bbb;padding:22px 0 4px;line-height:1.2}
.col .head b{display:block;font-family:var(--f-num);font-size:13px}
.col .cost{position:absolute;left:4px;top:26px;display:flex;flex-direction:column;gap:2px}
.col .cost i{width:9px;height:9px;background:#e4a077;border-radius:1px;display:block}
.stack{display:flex;flex-direction:column;margin-top:4px}
.stack .card{margin-top:-78px}
.stack .card:first-child{margin-top:0}
.bonusline{text-align:center;font-family:var(--f-num);color:#ccc;font-size:13px;border-top:1px solid #333;padding-top:4px}
.bonusline.on{color:var(--gold)}
@media (max-width:620px){.slots,.cols{gap:4px}.sheet{padding:6px}.col .head{font-size:9px}}

/* cards */
.card{width:100%;max-width:130px;aspect-ratio:746/1090;border-radius:6px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,#1d7a52 0,transparent 40%),radial-gradient(circle at 80% 70%,#136343 0,transparent 45%),var(--glitter);
  border:3px solid var(--glitter);display:flex;flex-direction:column;font-size:10px;user-select:none;text-align:left;padding:0;color:var(--ink);margin-inline:auto}
.card .inner{flex:1;margin:12px 3px 3px;border-radius:3px;background:linear-gradient(180deg,#2b3446 0,#1a2130 55%,#3a3322 100%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:3px}
.card.S .inner{background:linear-gradient(180deg,#26405f 0,#172436 55%,#223454 100%)}
.card.T .inner{background:linear-gradient(180deg,#244a39 0,#152a21 55%,#1f3d2f 100%)}
.card .topt{position:absolute;top:0;left:0;right:0;text-align:center;font-family:var(--f-num);font-size:6px;letter-spacing:.12em;color:#fff;line-height:12px}
.card .attr{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241a00;font-family:var(--f-num);font-weight:700;font-size:8px;padding:0 6px;border-radius:2px;white-space:nowrap}
.card.S .attr{background:#6fa6ff;color:#051a3a}
.card.T .attr{background:#58d18f;color:#062a16}
.card .bt,.card .logos,.card .attr,.card .ptv{z-index:2}
.card .bt{position:absolute;top:14px;right:3px;width:22px;height:22px}
.card .logos{position:absolute;top:14px;left:3px;display:flex;flex-direction:column;gap:2px}
.lg{font-family:var(--f-num);font-weight:700;font-size:7px;padding:1px 3px;border-radius:6px;color:#fff;line-height:1.2;white-space:nowrap;border:1px solid #ffffff55}
.lg.STU{background:#6b6b6b}
.lg.HAYABUSA2{background:#6d3fb6}.lg.MMX{background:#c2512c}.lg.MMO{background:#1f7fa8}.lg.DESTINY{background:#2d4fb0}
.lg.SOLARC{background:#b8801a}.lg.XRISM{background:#1a8f7a}.lg.ERG{background:#8f2a55}.lg.HINODE{background:#b13a3a}
.lg.hit{outline:2px solid var(--gold)}
.card .dept{font-size:7px;background:var(--gold);color:#241a00;padding:0 3px;border-radius:2px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.card.S .dept{background:#6fa6ff;color:#051a3a}.card.T .dept{background:#58d18f;color:#062a16}
.card .nm{font-family:var(--f-disp);font-size:13px;line-height:1.15;margin-top:2px;text-shadow:0 1px 2px #000}
.card .no{font-family:var(--f-num);font-size:6px;color:#cfd;opacity:.8}
.card .ptv{position:absolute;bottom:3px;right:4px;font-family:var(--f-num);font-weight:700;font-size:10px;color:var(--gold)}
.card.craft{background:linear-gradient(160deg,#0c1024,#030410);border-color:#1b1f3a}
.card.craft .inner{background:radial-gradient(circle at 60% 35%,#2b3470 0,#0a0d22 60%);}
.card.craft .nm{font-size:12px}
.card.craft .dept{background:var(--gold)}
.card.back{background:#fff;border-color:#fff;display:grid;place-content:center;gap:4px;text-align:center;color:#111}
.card.back .bk1{font-family:var(--f-num);font-weight:700;font-style:italic;font-size:9px;letter-spacing:.08em;color:#5a3d8f}.card.back .bk1 i{color:#1d3f9a}
.card.back .bk2{font-family:var(--f-num);font-weight:700;font-size:10px;line-height:1.1;letter-spacing:.06em}
.big .card.back .bk1{font-size:14px}.big .card.back .bk2{font-size:16px}
.piles{display:flex;gap:10px;align-items:flex-end}.piles .pile{width:64px;display:grid;gap:2px;text-align:center;font-family:var(--f-num);font-size:11px;color:var(--mute)}
.piles .pile .card{box-shadow:2px 2px 0 #cfcfcf,4px 4px 0 #9a9a9a}.piles .pile .card .bk1{font-size:6px}.piles .pile .card .bk2{font-size:7px}
.poolrow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.poolrow .pool{flex:1;min-width:0}
.card.sel{outline:3px solid var(--gold);outline-offset:1px}
.card.pay{outline:3px solid var(--danger);outline-offset:1px;filter:brightness(.7)}
.card.dim{opacity:.4}
button.card{cursor:pointer}
button.card:hover{transform:translateY(-3px)}
.card{transition:transform .12s}

.card.photo{background:#0c4a33;border:0;padding:0;border-radius:5px;box-shadow:0 0 0 1px #ffffff22}
.card.photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.photo.hitc{box-shadow:0 0 0 2px var(--gold)}
.big .card.photo{width:260px;max-width:100%}
/* all sheets */
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.sheetwrap{display:grid;gap:6px}
.sheetwrap .sh{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.sheetwrap .sh span{font-family:var(--f-num);color:var(--gold)}
.sheetwrap.cur .sheet{border-color:var(--gold)}
.sheet.compact{padding:6px;gap:6px}
.sheet.compact .slots,.sheet.compact .cols{gap:4px}
.sheet.compact .slot{min-height:96px}
.sheet.compact .col{min-height:110px}
.sheet.compact .col .head{font-size:8px;padding-top:20px}
.sheet.compact .stack .card{margin-top:-52px}
.sheet.compact .stack .card:first-child{margin-top:0}
.sheet.compact .cond{font-size:10px;gap:3px}
.sheet.compact .lbl{font-size:10px}
/* hand */
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.hand .cw{display:flex;flex-direction:column;gap:3px;align-items:center}
.hand .costtag{font-family:var(--f-num);font-size:11px;color:var(--mute)}
.hand .costtag b{color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.note{color:var(--mute);font-size:12px}

/* side */
.opp{display:grid;gap:8px}
.oppc{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)}
.oppc.cur{border-color:var(--gold)}
.oppc .nm{font-weight:700;display:flex;justify-content:space-between}
.oppc .nm span{font-family:var(--f-num);color:var(--gold)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-family:var(--f-num);font-size:11px;text-align:center;margin-top:4px}
.mini div{background:#0b0e14;border-radius:4px;padding:2px 0}
.mini small{display:block;color:var(--mute);font-size:9px}
.oppc .crafts{font-size:11px;color:var(--mute);margin-top:4px}
.log{max-height:260px;overflow:auto;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.log div b{color:var(--ink)}

/* modal */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--board);border:1px solid var(--gold-d);border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:12px}
.modal h2{font-family:var(--f-disp);font-weight:400;margin:0;font-size:20px}
/* 手番交代の確認は画面いっぱいに */
.modal.full{padding:0;background:var(--ground)}
.modal.full .box{width:100%;height:100%;max-width:none;max-height:none;border:0;border-radius:0;
  padding:24px;place-content:center;justify-items:center;align-content:center;gap:24px;text-align:center}
.modal.full h2{font-size:clamp(30px,8vw,60px);line-height:1.15}
.modal.full .lede{font-size:clamp(15px,3.4vw,22px);max-width:34ch;text-align:center}
.modal.full .btn{font-size:clamp(16px,4vw,22px);padding:16px 36px;border-radius:8px}
.big{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.big .card{max-width:190px;width:190px;font-size:14px}
.big .card .nm{font-size:20px}.big .card .dept{font-size:10px}.big .card .attr{font-size:11px}.big .card .lg{font-size:10px}.big .card .bt{width:34px;height:34px}.big .card .topt{font-size:8px}.big .card .ptv{font-size:14px}.big .card .no{font-size:9px}
.tags{display:flex;flex-wrap:wrap;gap:4px;max-width:320px}
.tags span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px}
table.score{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:13px}
table.score th,table.score td{padding:6px;border-bottom:1px solid var(--line);text-align:right}
table.score th:first-child,table.score td:first-child{text-align:left;font-family:var(--f-body)}
table.score tr.win td{color:var(--gold);font-weight:700}
.rules{font-size:13px;color:var(--mute);display:grid;gap:6px}
.rules b{color:var(--ink)}
.breakdown{font-family:var(--f-num);font-size:13px;display:grid;gap:2px}
</style>

</head><body><div class="wrap" id="app"></div>

<script>
/* サスプロゲーム headless rules engine
 * index.html のルール実装（costInfo / power / slotOk / score / 手番進行）を
 * グローバル状態に依存しない純粋関数として移植したもの。学習（Node）とブラウザの両方で使う。 */
(function (root) {
  "use strict";
  const COLS = [
    { k: "E", cost: 3, pts: 3 }, { k: "S", cost: 3, pts: 3 }, { k: "T", cost: 2, pts: 2 },
    { k: "ES", cost: 1, pts: 1 }, { k: "SS", cost: 1, pts: 1 },
  ];
  const COL_KEYS = COLS.map(c => c.k);
  const COLMAP = Object.fromEntries(COLS.map(c => [c.k, c]));
  const SLOTS = [{ p: 5, E: 5, S: 3, T: 1 }, { p: 5, E: 3, S: 5, T: 1 }, { p: 4, E: 4, S: 2, T: 1 }, { p: 3, E: 2, S: 3, T: 1 }, { p: 3, E: 3, S: 2, T: 1 }];
  const ALL_LOGOS = ["HAYABUSA2", "MMX", "MMO", "DESTINY", "SOLARC", "XRISM", "ERG", "HINODE"];
  const NO_DIRECTOR = "0006", NO_SAWAI = "0051", NO_TSUDA = "0070";

  function colOf(c) { if (c.fd) return "T"; if (c.a === "T") return "T"; if (c.a === "E") return c.st ? "ES" : "E"; return c.st ? "SS" : "S"; }
  function logosOf(c) { if (c.fd) return []; return c.no === NO_DIRECTOR ? ALL_LOGOS : c.l; }
  function bloodMatch(t, other) {
    if (!other) return false;
    if (t === "C" || other === "C") return true;
    if (other === "AB") return t === "A" || t === "B";
    return t === other;
  }
  function costInfo(P, card) {
    const col = colOf(card), base = COLMAP[col].cost, stack = P.cols[col];
    const opts = card.b === "AB" ? ["A", "B"] : [card.b];
    let blood = 0;
    for (const t of opts) { let n = 0; for (const x of stack) if (!x.fd && bloodMatch(t, x.b)) n++; if (n > blood) blood = n; }
    const top = stack[stack.length - 1];
    const basic = top && !top.fd && !top.st && top.l.length === 0 && top.no !== NO_DIRECTOR ? 1 : 0;
    return { col, base, blood, basic, cost: Math.max(0, base - blood - basic) };
  }
  function power(P) {
    let E = P.cols.ES.length, S = P.cols.SS.length;
    for (const c of P.cols.E) E += c.no === NO_SAWAI ? 3 : 2;
    for (const c of P.cols.S) S += c.no === NO_SAWAI ? 3 : 2;
    return { E, S, T: P.cols.T.length };
  }
  function slotOk(P, i, pw) { const s = SLOTS[i]; pw = pw || power(P); return !P.slots[i] && pw.E >= s.E && pw.S >= s.S && pw.T >= s.T; }
  function studentCount(P) { return P.cols.ES.length + P.cols.SS.length; }
  function canExpand(P) { return !P.expandUsed && studentCount(P) >= 3 && P.hand.length > 0; }
  function nextPlayer(S) { return S.players[(S.cur + 1) % S.players.length]; }
  function canHeadhunt(S, P) { const Q = nextPlayer(S); return !P.hhUsed && P.cols.T.length >= 2 && Q !== P && Q.hand.length > 0; }
  function doHeadhunt(S, P) { const Q = nextPlayer(S); const i = Math.floor(S.rnd() * Q.hand.length); const c = Q.hand.splice(i, 1)[0]; P.hand.push(c); P.hhUsed = true; return c; }
  function allHired(P) { const r = []; for (const k of COL_KEYS) for (const c of P.cols[k]) r.push(c); return r; }
  function score(P) {
    let exp = 0; for (const c of COLS) exp += P.cols[c.k].length * c.pts;
    let crafts = 0; const launched = [];
    for (let i = 0; i < 5; i++) if (P.slots[i]) { crafts += SLOTS[i].p; launched.push(P.slots[i].k); }
    let proj = 0;
    if (launched.length) for (const k of COL_KEYS) for (const c of P.cols[k]) { const L = logosOf(c); for (const x of launched) if (L.includes(x)) proj++; }
    let comp = 3; for (const k of COL_KEYS) if (!P.cols[k].length) { comp = 0; break; }
    return { exp, crafts, proj, comp, total: exp + crafts + proj + comp };
  }

  /* ---------- game flow (seedable) ---------- */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function newPlayer(name) { return { name, hand: [], cols: { E: [], S: [], T: [], ES: [], SS: [] }, slots: [null, null, null, null, null], expandUsed: false, hhUsed: false, turns: 0 }; }
  function newGame(CARDS, CRAFTS, nPlayers, nCrafts, rnd) {
    const deck = shuffle(CARDS.map(c => ({ ...c })), rnd);
    const pool = shuffle(CRAFTS.map(c => ({ ...c })), rnd).slice(0, nCrafts);
    const players = []; for (let i = 0; i < nPlayers; i++) players.push(newPlayer("P" + (i + 1)));
    const S = { deck, discard: [], pool, players, cur: 0, round: 1, lastRound: false, over: false, rnd };
    players.forEach((P, idx) => { for (let i = 0; i < 7 + idx; i++) draw(S, P); });
    return S;
  }
  function draw(S, P) {
    if (!S.deck.length) { if (!S.discard.length) return null; S.deck = shuffle(S.discard, S.rnd); S.discard = []; }
    const c = S.deck.pop(); P.hand.push(c); return c;
  }
  function startTurn(S) { const P = S.players[S.cur]; draw(S, P); draw(S, P); }
  function doHire(S, P, card, payIds) {
    const ci = costInfo(P, card);
    P.hand = P.hand.filter(c => c !== card);
    const paid = P.hand.filter(c => payIds.includes(c.id));

const NO_DIRECTOR="0006", NO_SAWAI="0051";

function colOf(c){ if(c.fd) return "T"; if(c.a==="T") return "T"; if(c.a==="E") return c.st?"ES":"E"; return c.st?"SS":"S"; }
function logosOf(c){ if(c.fd) return []; return c.no===NO_DIRECTOR? ALL_LOGOS : c.l; }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- rules engine ---------- */
function bloodMatch(t, other){ // t: A|B|O|C (new, resolved) ; other: existing blood
  if(!other) return false;
  if(t==="C"||other==="C") return true;
  if(other==="AB") return t==="A"||t==="B";
  return t===other;
}
function costInfo(P, card){
  const col=colOf(card), base=COLMAP[col].cost, stack=P.cols[col];
  const opts = card.b==="AB"?["A","B"]:[card.b];
  let blood=0;
  for(const t of opts){ const n=stack.filter(x=>!x.fd && bloodMatch(t,x.b)).length; if(n>blood) blood=n; }
  const top=stack[stack.length-1];
  const basic = top && !top.fd && !top.st && top.l.length===0 && top.no!==NO_DIRECTOR ? 1:0;
  return {col,base,blood,basic,cost:Math.max(0,base-blood-basic)};
}
function power(P){
  const w=c=>c.no===NO_SAWAI?3:2;
  return {
    E: P.cols.E.reduce((s,c)=>s+w(c),0)+P.cols.ES.length,
    S: P.cols.S.reduce((s,c)=>s+w(c),0)+P.cols.SS.length,
    T: P.cols.T.length,
  };
}
function slotOk(P,i){ const s=SLOTS[i],pw=power(P); return !P.slots[i] && pw.E>=s.E && pw.S>=s.S && pw.T>=s.T; }
function studentCount(P){return P.cols.ES.length+P.cols.SS.length;}
function canExpand(P){return !P.expandUsed && studentCount(P)>=3 && P.hand.length>0;}
function nextP(){return G.players[(G.cur+1)%G.players.length];}
function canHeadhunt(P){const Q=nextP(); return !P.hhUsed && P.cols.T.length>=2 && Q!==P && Q.hand.length>0;}
function headhunt(P){
  const Q=nextP(), c=Q.hand.splice(Math.floor(Math.random()*Q.hand.length),1)[0];
  P.hand.push(c); P.hhUsed=true;
  log(`${esc(P.name)} が <b>ヘッドハンティング</b>（${esc(Q.name)} の手札から1枚獲得）`);
  return c;
}
function allHired(P){return COLS.flatMap(c=>P.cols[c.k]);}
function score(P){
  const hired=allHired(P);
  const exp=COLS.reduce((s,c)=>s+P.cols[c.k].length*c.pts,0);
  const crafts=P.slots.reduce((s,x,i)=>s+(x?SLOTS[i].p:0),0);
  let proj=0; const launched=P.slots.filter(Boolean).map(x=>x.k);
  for(const c of hired){ const L=logosOf(c); proj+=launched.filter(k=>L.includes(k)).length; }
  const comp=COLS.every(c=>P.cols[c.k].length>0)?3:0;
  return {exp,crafts,proj,comp,total:exp+crafts+proj+comp};
}

  const players=SETUP.players.slice(0,SETUP.n).map((p,i)=>({name:p.name||("P"+(i+1)),cpu:p.cpu,strong:!!(p.cpu&&p.strong),hand:[],cols:{E:[],S:[],T:[],ES:[],SS:[]},slots:[null,null,null,null,null],expandUsed:false,hhUsed:false,turns:0}));
  G={deck,discard:[],pool,players,cur:0,round:1,phase:"hire",hires:0,launched:false,log:[],over:false,lastRound:false};
  players.forEach((P,idx)=>{ for(let i=0;i<7+idx;i++) draw(P); });
  try{localStorage.setItem("suspro-setup",JSON.stringify(SETUP));}catch(e){}
  startTurn();
}
function draw(P){
  if(!G.deck.length){ if(!G.discard.length) return null; G.deck=shuffle(G.discard); G.discard=[]; log("捨て札をシャッフルして山札に補充"); }
  const c=G.deck.pop(); P.hand.push(c); return c;
}
function log(m){G.log.unshift(m); if(G.log.length>80) G.log.pop();}
function curP(){return G.players[G.cur];}
function startTurn(){
  const P=curP(); let n=0; for(let i=0;i<2;i++) if(draw(P)) n++;
  G.phase="hire"; G.hires=0; G.launched=false;
  UI={...UI,sel:null,pay:[],expand:false,craft:null};
  log(`<b>${esc(P.name)}</b> のターン（${n}枚ドロー）`);
  const humans=G.players.filter(p=>!p.cpu).length;
  UI.pass = !P.cpu && humans>1;
  render();
  if(P.cpu) setTimeout(cpuTurn, 700);
}
function hire(P, card, payIds){
  const ci=costInfo(P,card);
  P.hand=P.hand.filter(c=>c!==card);
  const paid=P.hand.filter(c=>payIds.includes(c.id));
  P.hand=P.hand.filter(c=>!payIds.includes(c.id));
  G.discard.push(...paid);
  P.cols[ci.col].push(card); G.hires++;
  log(`${esc(P.name)} が <b>${esc(card.n)}</b> を雇用（${COLMAP[ci.col].jp}・コスト${ci.cost}）`);
}
function expand(P, card){
  P.hand=P.hand.filter(c=>c!==card);
  P.cols.T.push({...card,fd:true}); P.expandUsed=true; G.hires++;
  log(`${esc(P.name)} が研究室を拡大（手札1枚を一般職員として雇用）`);
}
function launch(P, craft, slot){
  P.slots[slot]=craft; G.pool=G.pool.filter(c=>c!==craft); G.launched=true;
  log(`🚀 ${esc(P.name)} が <b>${esc(craft.n)}</b> を打ち上げ（${SLOTS[slot].p}点枠）`.replace("🚀 ",""));
}
function endTurn(){
  const P=curP(); P.turns++;
  if(G.pool.length===0 || G.round>=40) G.lastRound=true;
  const last=G.cur===G.players.length-1;
  if(G.lastRound && last){ G.over=true; log("ゲーム終了"); render(); return; }
  G.cur=(G.cur+1)%G.players.length; if(G.cur===0) G.round++;
  startTurn();
}

/* ---------- CPU ---------- */
function cardValue(P,c){
  const ci=costInfo(P,c), col=COLMAP[ci.col], pw=power(P);
  let v=col.pts - ci.cost*0.9;
  const open=SLOTS.filter((s,i)=>!P.slots[i]);
  const need={E:0,S:0,T:0}; for(const s of open){need.E=Math.max(need.E,s.E-pw.E);need.S=Math.max(need.S,s.S-pw.S);need.T=Math.max(need.T,s.T-pw.T);}
  const kind=ci.col==="T"?"T":ci.col.startsWith("E")?"E":"S";
  if(need[kind]>0) v+=2.2;
  if(P.cols[ci.col].length===0) v+=1.2;
  const targets=[...G.pool.map(x=>x.k),...P.slots.filter(Boolean).map(x=>x.k)];
  v+=logosOf(c).filter(k=>targets.includes(k)).length*0.8;
  return v;
}
function cpuTurn(){
  if(curP().strong) return strongCpuTurn();
  const P=curP();
  if(canHeadhunt(P)) headhunt(P);
  for(let h=0;h<2;h++){
    if(canExpand(P) && P.cols.T.length<2){ const worst=[...P.hand].sort((a,b)=>cardValue(P,a)-cardValue(P,b))[0]; expand(P,worst); continue; }
    let best=null,bv=0.2;
    for(const c of P.hand){ const ci=costInfo(P,c); if(P.hand.length-1<ci.cost) continue; const v=cardValue(P,c); if(v>bv){bv=v;best=c;} }
    if(!best) break;
    const ci=costInfo(P,best);
    const pay=P.hand.filter(c=>c!==best).sort((a,b)=>cardValue(P,a)-cardValue(P,b)).slice(0,ci.cost).map(c=>c.id);
    hire(P,best,pay);
  }
  const opt=bestLaunch(P); if(opt) launch(P,opt.craft,opt.slot);
  render(); setTimeout(endTurn, 900);
}
function bestLaunch(P){
  let best=null,bv=-1; const hired=allHired(P);
  for(let i=0;i<5;i++){ if(!slotOk(P,i)) continue;
    for(const c of G.pool){ const v=SLOTS[i].p+hired.filter(h=>logosOf(h).includes(c.k)).length; if(v>bv){bv=v;best={slot:i,craft:c};} } }
  return best;
}


/* ---------- 強CPU（強化学習で学習した価値関数 + 手番全探索） ---------- */
const STRONG_NET = SusproAI.netFromJSON(STRONG_WEIGHTS);
function strongCpuTurn(){
  const P=curP(), me=G.cur, g0=G;
  if(canHeadhunt(P)) headhunt(P);
  // 盤面のコピーで計画（見えている情報＝自分の手札・全員の盤面・場・相手の手札枚数だけを使う）
  const cl=p=>({...p,hand:[...p.hand],cols:{E:[...p.cols.E],S:[...p.cols.S],T:[...p.cols.T],ES:[...p.cols.ES],SS:[...p.cols.SS]},slots:[...p.slots]});
  const S={pool:[...G.pool],round:G.round,lastRound:G.lastRound,players:G.players.map(cl)};
  let plan=null;
  try{ plan=SusproAI.planTurn(S,me,STRONG_NET).plan; }catch(e){ console.error(e); }
  if(!plan){ P.strong=false; cpuTurn(); P.strong=true; return; }
  const steps=plan.slice();
  const step=()=>{
    if(G!==g0) return; // 途中でやめた場合
    if(!steps.length){ render(); setTimeout(()=>{ if(G===g0) endTurn(); },900); return; }
    const a=steps.shift();
    if(a.t==="hire"){ const c=P.hand.find(x=>x.id===a.id); if(c) hire(P,c,a.pay); }
    else if(a.t==="expand"){ const c=P.hand.find(x=>x.id===a.id); if(c) expand(P,c); }
    else if(a.t==="launch"){ G.phase="launch"; const cr=G.pool.find(x=>x.k===a.k); if(cr&&slotOk(P,a.slot)) launch(P,cr,a.slot); }
    render(); setTimeout(step,600);
  };
  step();
}

function bloodSvg(b,z){
  const g=z>=0?ZOD[z]:"";
  let shape;
  if(b==="A") shape='<path d="M11 1.5 L20.5 20.5 H1.5 Z" fill="#f2c318" stroke="#b48a00" stroke-width="1"/>';
  else if(b==="B") shape='<path d="M3 2 H15 Q20.5 2 20.5 7 Q20.5 10 18 11 Q20.5 12.5 20.5 15.5 Q20.5 20.5 15 20.5 H3 Z" fill="#f2c318" stroke="#b48a00" stroke-width="1"/>';
  else if(b==="AB") shape='<path d="M8 1.5 L14.5 20.5 H1.5 Z" fill="#f2c318" stroke="#b48a00"/><path d="M11 3 H17 Q21 3 21 7 Q21 10 19 11 Q21 12.5 21 15.5 Q21 20 17 20 H11 Z" fill="#f2c318" stroke="#b48a00"/>';

  return `<svg class="bt" viewBox="0 0 22 22" aria-label="${b}型">${shape}${glyph}</svg>`;
}

  const top=rows[0].s.total;
  return `<div class="modal"><div class="box"><h2>ゲーム終了</h2><p class="lede">${rows.filter(r=>r.s.total===top).map(r=>esc(r.P.name)).join("・")} の勝利！</p>
  <div style="overflow-x:auto"><table class="score"><tr><th>センター長</th><th>探究者</th><th>宇宙機</th><th>PJ</th><th>コンプ</th><th>合計</th></tr>
  ${rows.map(r=>`<tr class="${r.s.total===top?"win":""}"><td>${esc(r.P.name)}</td><td>${r.s.exp}</td><td>${r.s.crafts}</td><td>${r.s.proj}</td><td>${r.s.comp}</td><td>${r.s.total}</td></tr>`).join("")}</table></div>
  <div class="actions"><button class="btn primary" data-act="again">もう一度</button><button class="btn" data-act="quit">設定に戻る</button><button class="btn ghost" data-act="closeover">盤面を見る</button></div></div></div>`;
}
function rulesHTML(){
  return `<div class="modal" data-act="closerules"><div class="box"><h2>ルールのまとめ</h2><div class="rules">
  <div><b>ゲームの目的</b>：あなたは宇宙センターのセンター長です。各分野の人材を雇用し、宇宙プロジェクトを成功に導いて、最も多くの功績を上げることを目指します。</div>
  <div><b>ゲームの流れ</b>：ゲームはターン制で進行します。</div>
  <div><b>初期手札</b>：最初の手番の人は7枚、以降の人は手番順に1枚ずつ増える（例：3人プレイなら1番目7枚・2番目8枚・3番目9枚）。</div>
  <div><b>1ターンの行動手順</b>：探究者カードを2枚引いて手札に加える → 探究者を2人まで場に出す（雇用） → 条件を満たす宇宙機を1機まで獲得する（打ち上げ） → 終了。</div>
  <div><b>雇用コスト</b>：工学・理学の研究者3、一般職員2、学生1。手札を捨て札にして支払う。</div>
  <div><b>雇用コスト軽減</b>：次の条件を満たす場合、同じ属性の探究者カードの雇用コストを0になるまで軽減できる。
    <ul>
      <li><b>血液型</b>：探究者を既に雇用している場合、新しく雇用する探究者と同じ血液型の探究者カード1枚につき、雇用コストを1減らすことができる。ただし、AB型はA型またはB型として扱い、C型の津田副所長は全ての血液型と一致するとして扱う。</li>
      <li><b>基礎研究</b>：左上にロゴがない研究者または一般職員を雇用した場合、次に探究者カードを重ねる際の雇用コストを1減らすことができる。ただし、学生ロゴはロゴとして扱う。この効果は、血液型によるコスト軽減と併用できる。</li>
      <li><b>研究室の拡大</b>：雇用している学生が合計3枚以上ならゲーム中に1回だけ、手札1枚を伏せて一般職員としてコスト無しで雇用できる（2人の雇用枠を1つ使う）。</li>
    </ul>
  </div>
  <div><b>ヘッドハンティング</b>：一般職員を2人以上雇用していればゲーム中に1回だけ、自分のターンの雇用フェイズ中に、次の手番の人の手札からランダムに1枚を獲得して自分の手札に加えられる（雇用枠は使わない）。</div>
  <div><b>宇宙機の打ち上げ</b>：プレイシートに記載された必要な属性を持つ探究者カードを、指定された枚数だけ雇用している（⚒工学・🔭&#xFE0E;理学・◎職員）と、未打ち上げの宇宙機から自由に選んで置ける。研究者は2枚分、澤井副所長は3枚分として扱う。</div>
  <div><b>得点</b>：探究者の点＋宇宙機枠の点＋プロジェクトボーナス（打ち上げた宇宙機と同じロゴの探究者1枚につき+1、藤本所長は全ロゴ）＋全5属性そろえると+3。この合計得点が高い人が勝ち。</div>
  <div><b>終了</b>：場の宇宙機がすべて打ち上がったら、そのラウンドの最後のプレイヤーまで遊んで終了。</div>
  </div><button class="btn" data-act="closerules">閉じる</button></div></div>`;
}
function setupHTML(){
  const pls=SETUP.players.slice(0,SETUP.n).map((p,i)=>`<div class="pl-row"><label for="pn${i}">P${i+1}</label><input id="pn${i}" data-pn="${i}" value="${esc(p.name)}" maxlength="12"><select id="pc${i}" data-pc="${i}"><option value="h" ${!p.cpu?"selected":""}>人間</option><option value="c" ${p.cpu&&!p.strong?"selected":""}>CPU</option><option value="s" ${p.cpu&&p.strong?"selected":""}>CPU（強）</option></select></div>`).join("");
  return `<header class="top"><div class="brand"><small>ISAS / JAXA EXPLORERS CARD</small><h1>サスプロゲーム</h1></div></header>
  <section class="setup"><div><h2>宇宙センター長として、探究者を雇い宇宙機を打ち上げよう</h2>
  <p class="lede">FY2026 探究者カード${CARDS.length}枚・宇宙機カード${CRAFTS.length}枚を収録。1台の画面で交代しながら、またはCPUと対戦できます（2人〜4人・約20分）。</p></div>
  <div class="row"><label for="np">人数</label><select id="np">${[2,3,4].map(n=>`<option ${SETUP.n===n?"selected":""}>${n}</option>`).join("")}</select>
  <label for="nc">使う宇宙機</label><select id="nc">${[3,4,5,6,7,8].map(n=>`<option ${SETUP.crafts===n?"selected":""}>${n}</option>`).join("")}</select></div>
  <div style="display:grid;gap:8px">${pls}</div>
  <div class="row"><button class="btn primary" data-act="start">ゲーム開始</button><button class="btn ghost" data-act="rules0">ルールを見る</button></div>
  <div><h3 style="font-size:12px;color:var(--mute);letter-spacing:.14em;margin:0 0 8px">収録カードの一部</h3><div class="hand">${[6,52,71,0,12,92].map(i=>i<CARDS.length?cardHTML(CARDS[i]):"").join("")}${cardHTML(CRAFTS[2])}${cardHTML({back:1})}</div></div>
  </section>${UI.showRules?rulesHTML():""}`;
}

/* ---------- events ---------- */
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="np"){SETUP.n=+t.value;render();}
  else if(t.id==="nc"){SETUP.crafts=+t.value;}
  else if(t.dataset.pc){const q=SETUP.players[+t.dataset.pc]; q.cpu=t.value!=="h"; q.strong=t.value==="s";}
});
document.addEventListener("input",e=>{const t=e.target; if(t.dataset.pn){SETUP.players[+t.dataset.pn].name=t.value;}});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.act==="slot"){e.preventDefault();e.target.click();} if(e.key==="Escape"&&(UI.detail||UI.showRules)){UI.detail=null;UI.showRules=false;render();}});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  if(el.classList.contains("modal") && e.target!==el) return;
  const P=G&&curP();
  const findHand=()=>P.hand.find(c=>String(c.id)===id);
  switch(act){
    case "start": newGame(); break;
    case "again": newGame(); break;
    case "quit": if(!G||G.over||confirm("ゲームをやめて設定に戻りますか？")){G=null;render();} break;
    case "rules": case "rules0": UI.showRules=true; render(); break;
    case "closerules": UI.showRules=false; render(); break;
    case "closeover": G.over=false; G.phase="done"; render(); break;
    case "unpass": UI.pass=false; render(); break;
    case "detail": {
      let c=null;
      if(el.closest(".pool")) c=G.pool[+id];
      else { for(const p of G.players){ c=p.hand.find(x=>String(x.id)===id)||allHired(p).find(x=>String(x.id)===id)||p.slots.find(x=>x&&x.no===id); if(c) break; } }
      if(c){UI.detail=c;render();} break; }
    case "close": UI.detail=null; render(); break;
    case "pick": { if(G.hires>=2) return; const c=findHand(); if(!c) return; const ci=costInfo(P,c);
      if(P.hand.length-1<ci.cost){UI.detail=c;render();return;}
      UI.sel=c; UI.pay=[];
      if(ci.cost===0){ hire(P,c,[]); UI.sel=null; }
      render(); break; }
    case "pay": { const c=findHand(); if(!c) return; if(c===UI.sel){UI.sel=null;UI.pay=[];render();return;}
      const need=costInfo(P,UI.sel).cost;
      if(UI.pay.includes(c.id)) UI.pay=UI.pay.filter(x=>x!==c.id); else if(UI.pay.length<need) UI.pay.push(c.id);
      render(); break; }
    case "confirm": hire(P,UI.sel,UI.pay); UI.sel=null; UI.pay=[]; render(); break;
    case "cancel": UI.sel=null; UI.pay=[]; UI.expand=false; UI.craft=null; render(); break;
    case "expand": UI.expand=true; render(); break;
    case "headhunt": if(G.phase==="hire"&&!UI.sel&&!UI.expand&&canHeadhunt(P)){ const Q=nextP(); if(confirm(`${Q.name} の手札からランダムに1枚獲得します（ゲーム中1回限り）。よろしいですか？`)){ const c=headhunt(P); render(); UI.detail=c; render(); } } break;
    case "expandpick": { const c=findHand(); if(c){expand(P,c);UI.expand=false;render();} break; }
    case "tolaunch": G.phase="launch"; UI.sel=null; UI.pay=[]; render(); break;
    case "craft": UI.craft=G.pool[+id]; render(); break;
    case "slot": if(UI.craft && slotOk(P,+id)){ launch(P,UI.craft,+id); UI.craft=null; render(); } break;
    case "end": endTurn(); break;
  }
});
render();
</script>
</body></html>
